<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modellvergleich</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23141a2e'/%3E%3Cpath d='M16 44V30M28 44V20M40 44V26M52 44V14' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
[hidden]{display:none !important}
:root{
  --ink:#0f1420; --ink-2:#4a5263; --ink-3:#7c8496;
  --glas:rgba(255,255,255,.58); --glas-2:rgba(255,255,255,.78); --kante:rgba(255,255,255,.8); --linie:rgba(20,30,60,.09);
  --good:#0f9d58; --warn:#e8a200; --crit:#d93838; --c1:#2a78d6;
  --good-bg:rgba(15,157,88,.12); --warn-bg:rgba(232,162,0,.14); --crit-bg:rgba(217,56,56,.11);
  --r:22px; --schatten:inset 0 1px 0 rgba(255,255,255,.9),0 10px 34px rgba(30,40,80,.10);
  --mono:ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,Consolas,monospace;
  font-family:Inter,"SF Pro Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:#e8ecf3}
body{margin:0;color:var(--ink);font-size:16px;line-height:1.45;min-height:100vh;
  background:radial-gradient(1100px 760px at 6% -8%,#c8dbff 0,transparent 62%),radial-gradient(900px 700px at 102% 4%,#ecd8ff 0,transparent 58%),
  radial-gradient(1000px 800px at 55% 118%,#cdf1e2 0,transparent 60%),radial-gradient(700px 600px at -6% 90%,#ffe3cf 0,transparent 60%),#e8ecf3;background-attachment:fixed}
button,select,textarea,input{font:inherit;color:inherit}
svg.i{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.18em}
.glas{background:var(--glas);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--kante);border-radius:var(--r);box-shadow:var(--schatten)}
.wrap{width:min(1600px,100% - 40px);margin:0 auto}
header{padding:14px 0 16px}
.leiste{display:flex;align-items:center;gap:12px;flex-wrap:nowrap}
.leiste > *{flex:none}.leiste > .gruppe{flex:0 1 auto;min-width:0}
.ds-wahl{min-width:0;display:flex;align-items:center;gap:8px}
#ds{padding-right:14px}
.leiste h1{font-size:22px}
.leiste .logo{width:40px;height:40px;border-radius:12px}
.leiste .tabs{padding:4px}
.leiste .tab{padding:8px 16px;font-size:15px}
.titel{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;margin-right:6px}
.leiste .rechts{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.gruppe{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 14px;border-radius:999px;font-size:13.5px;color:var(--ink-2);min-height:46px;white-space:nowrap}
.gruppe .trenner,.gpu .trenner{width:1px;height:22px;background:var(--linie);flex:none}
.gruppe.sys{padding-right:16px}
.gruppe.sys b{color:var(--ink)}
.gpu{display:inline-flex;align-items:center;gap:10px;white-space:nowrap}
.rund{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);text-decoration:none}
.rund:hover{color:var(--ink);background:#fff}
.rund svg{width:20px;height:20px}
.zwei.einzeln{grid-template-columns:1fr}
.zwei.einzeln > :last-child{display:none}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#1d2640,#0e1322);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
.chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.punkt{width:9px;height:9px;border-radius:50%;background:var(--ink-3)}
.punkt.an{background:var(--good)}.punkt.aus{background:var(--crit)}
.schalter{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.schalter input{position:absolute;opacity:0;width:1px;height:1px}
.toggle{width:40px;height:23px;border-radius:12px;background:#c3c9d4;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.schalter input:checked + .toggle,.wz-schalter input:checked + .toggle{background:var(--good)}
.schalter input:checked + .toggle::after,.wz-schalter input:checked + .toggle::after{left:19.5px}
.schalter input:focus-visible + .toggle,.wz-schalter input:focus-visible + .toggle{outline:2px solid var(--c1);outline-offset:2px}
.tabs{display:flex;gap:4px;padding:5px}
.tab{border:0;background:transparent;padding:9px 18px;border-radius:14px;font-weight:650;font-size:16px;cursor:pointer;color:var(--ink-2)}
.tab[aria-selected=true]{background:var(--ink);color:#fff}
.ds-wahl{display:flex;align-items:center;gap:10px}
.ds-wahl span{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.ds-wahl select{border:0;background:rgba(255,255,255,.75);border-radius:999px;padding:6px 10px;max-width:260px;cursor:pointer;font-size:14px}
select,input[type=text],input[type=search],input[type=number],input[type=url],input[type=password],textarea{padding:9px 12px;border-radius:12px;border:1px solid var(--linie);background:#fff;font-size:15px}
.knopf{border:1px solid var(--kante);background:var(--glas-2);padding:8px 14px;border-radius:13px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;box-shadow:0 1px 3px rgba(30,40,80,.06);text-decoration:none;color:var(--ink)}
.knopf:hover{background:#fff}
.knopf.primaer{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 6px 18px rgba(15,20,32,.25)}
.knopf.primaer:hover{background:#262d40}
.knopf:disabled{opacity:.45;cursor:not-allowed}
.knopf.klein{padding:5px 10px;font-size:13.5px}
.leer{color:var(--ink-3)}
.etikett{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:12px 0 6px}
.etikett:first-child{margin-top:0}
.klein{font-size:13.5px;color:var(--ink-3)}
.box{border-radius:14px;padding:10px 14px;font-size:14.5px}
.box.warn{background:var(--warn-bg);color:#6b4800}.box.ok{background:var(--good-bg);color:#0b5c35}.box.fehler{background:var(--crit-bg);color:#8f1f1f}.box.info{background:rgba(42,120,214,.10);color:#174a87}
.swatch{width:11px;height:11px;border-radius:4px;background:var(--farbe,#999);display:inline-block;flex:none}
.seite{display:none}.seite.aktiv{display:block}
.zwei{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}
@media (max-width:1000px){.zwei{grid-template-columns:1fr}}
.panel{padding:18px 20px}
.chips-w{display:flex;flex-wrap:wrap;gap:6px}
.wchip{display:inline-flex;gap:7px;align-items:center;padding:6px 12px;border-radius:999px;background:var(--glas-2);border:1.5px solid transparent;font-size:14px;cursor:pointer;user-select:none}
.wchip.an{border-color:var(--ink);background:#fff;font-weight:600}
.wchip input{display:none}
.fortschritt{height:8px;border-radius:5px;background:rgba(20,30,60,.08);overflow:hidden;margin-top:6px}
.fortschritt i{display:block;height:100%;background:var(--good);transition:width .3s}
.leerzustand{padding:40px 24px;text-align:center;color:var(--ink-2)}
.leerzustand b{display:block;font-size:19px;color:var(--ink);margin-bottom:6px}
/* Rangliste */
table.rang{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.rang th,.rang td{padding:9px 10px;border-bottom:1px solid var(--linie);text-align:right;white-space:nowrap}
.rang th:nth-child(-n+2),.rang td:nth-child(-n+2){text-align:left}
.rang th{color:var(--ink-3);font-weight:600;font-size:13px}
.nm{display:inline-flex;align-items:center;gap:7px}
.marke{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(20,30,60,.07);color:var(--ink-3)}
.marke.vorl{background:var(--warn-bg);color:#7a5200}
.balken{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.balken i{display:inline-block;height:8px;border-radius:4px;background:var(--good)}
.weg{border:0;background:none;cursor:pointer;color:var(--ink-3);padding:2px 4px}
.weg:hover{color:var(--crit)}
/* Chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:520px;padding:0;overflow:hidden}
.verlauf{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.eingabe{border-top:1px solid var(--linie);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.eingabe .zeile{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eingabe textarea{flex:1;resize:none;min-height:46px;max-height:200px}
.blase{max-width:860px;padding:12px 15px;border-radius:16px;font-size:15.5px;white-space:pre-wrap;word-wrap:break-word}
.blase.du{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.blase.ki{align-self:flex-start;background:#fff;border-bottom-left-radius:6px;box-shadow:0 1px 3px rgba(30,40,80,.06)}
.md{white-space:normal;line-height:1.55}
.md > :first-child{margin-top:0}.md > :last-child{margin-bottom:0}
.md p{margin:0 0 10px}.md ul,.md ol{margin:0 0 10px;padding-left:24px}.md li{margin:3px 0}.md li > ul,.md li > ol{margin:4px 0 0}
.md h3,.md h4,.md h5,.md h6,.md h7,.md h8{margin:14px 0 6px;line-height:1.3}.md h3{font-size:17.5px}.md h4{font-size:16px}.md h5,.md h6{font-size:15px}
.md code{font-family:var(--mono);font-size:.88em;background:rgba(20,30,60,.06);padding:1px 5px;border-radius:5px}
.md pre{margin:0 0 10px;padding:10px 12px;background:#14192b;color:#e7ebf5;border-radius:10px;overflow-x:auto;white-space:pre}
.md pre code{background:none;padding:0;color:inherit;font-size:13px}
.md blockquote{margin:0 0 10px;padding:4px 12px;border-left:3px solid rgba(42,120,214,.4);color:var(--ink-2)}
.md hr{border:0;border-top:1px solid var(--linie);margin:12px 0}
.md a{color:var(--c1)}
.md-tab{overflow-x:auto;margin:0 0 10px}.md table{border-collapse:collapse;font-size:14px}
.md th,.md td{border:1px solid var(--linie);padding:5px 9px;text-align:left;vertical-align:top}.md th{background:rgba(20,30,60,.04)}
.ki-kopf{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:4px;white-space:normal}
.ki-kopf .rechts{margin-left:auto;font-weight:500;color:var(--ink-3)}
.gedanken{font-size:13.5px;color:var(--ink-3);border-left:3px solid rgba(20,30,60,.12);padding-left:9px;margin-bottom:6px;max-height:160px;overflow-y:auto}
.vergleich{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;align-self:stretch}
.vergleich .blase{max-width:none}
.bewertung{align-self:stretch;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.bw{background:#fff;border-radius:16px;padding:12px 15px;box-shadow:0 1px 3px rgba(30,40,80,.06);font-size:14.5px;display:flex;flex-direction:column;gap:6px}
.bw .note{display:flex;align-items:baseline;gap:10px}
.bw .note b{font-size:28px;letter-spacing:-.02em}
.urteil{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px}
.urteil.ok{background:var(--good-bg);color:#0b7a44}.urteil.fast{background:var(--warn-bg);color:#7a5200}.urteil.nein{background:var(--crit-bg);color:#a62828}
.schritte{font-size:12.5px;color:var(--ink-3)}
.auftrag{align-self:stretch;background:rgba(42,120,214,.08);border-radius:16px;padding:12px 15px;font-size:14.5px;white-space:pre-wrap}
.auftrag b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#174a87;margin-bottom:4px}
.antw{display:flex;gap:9px;padding:9px 11px;border-radius:12px;background:var(--glas-2);border:1.5px solid transparent;cursor:pointer;font-size:14px}
.antw.an{border-color:var(--ink);background:#fff}
.antw input{margin-top:3px;accent-color:var(--ink)}
.antw .t{flex:1;white-space:pre-wrap;max-height:66px;overflow:hidden}
.antw small{color:var(--ink-3);white-space:nowrap}
/* Daten */
.abb{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.abb figure{margin:0;flex:1 1 140px;max-width:260px;background:#fff;border-radius:12px;padding:6px;border:1px solid var(--linie)}
.abb img{width:100%;max-height:170px;object-fit:contain;border-radius:8px;cursor:zoom-in;display:block}
.abb.kompakt figure{max-width:none;padding:4px}
.abb.kompakt img{max-height:150px}
.abb figcaption{font-size:11.5px;color:var(--ink-3);margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.ablage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:22px 14px;border-radius:16px;border:2px dashed rgba(20,30,60,.18);background:rgba(255,255,255,.55);cursor:pointer;transition:all .15s;min-height:128px}
.ablage:hover,.ablage:focus-visible{border-color:var(--c1);background:rgba(42,120,214,.06);outline:none}
.ablage.drueber{border-color:var(--c1);background:rgba(42,120,214,.12);transform:scale(1.01)}
.ablage .ab-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(42,120,214,.12);color:var(--c1);margin-bottom:4px}
.ablage .ab-ic svg{width:20px;height:20px}
.ablage b{font-size:15px}.ablage small{font-size:13px;color:var(--ink-3)}
.status-karte{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:13px 14px;border-radius:14px;font-size:14px}
.status-karte b{font-size:15px}
.status-karte small{font-size:13px;opacity:.85}
.status-karte.warn{background:var(--warn-bg);color:#6b4800;border:1px solid rgba(232,162,0,.35)}
.status-karte.ok{background:var(--good-bg);color:#0b5c35;border:1px solid rgba(15,157,88,.3)}
.status-karte.fehler{background:var(--crit-bg);color:#8f1f1f;border:1px solid rgba(217,56,56,.3)}
.warte-z{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.warte-z .fach{font-weight:700;margin-right:auto}
.tag-k.fehlt{background:#fff;color:#a62828;border:1px dashed rgba(217,56,56,.5)}
.tag-k{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.7);color:var(--ink-3)}
.tag-k.ok{color:#0b7a44}
.format{margin-top:14px}.format summary{cursor:pointer;font-size:13.5px;color:var(--ink-2);font-weight:600}
.ds-karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ds-k{padding:14px 16px;border-radius:16px;background:var(--glas-2);border:1.5px solid transparent;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.ds-k.an{border-color:var(--ink);background:#fff}
.ds-k small{color:var(--ink-2)}
.aufgabe-k{padding:14px 16px;border-radius:16px;background:var(--glas-2);margin-bottom:8px}
.aufgabe-k summary{cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
.aufgabe-k summary::-webkit-details-marker{display:none}
.aufgabe-k summary .id{font-family:var(--mono);font-size:13px;color:var(--ink-3)}
.aufgabe-k .inhalt{margin-top:10px;display:grid;gap:8px;font-size:14.5px}
.feld-t{white-space:pre-wrap;background:#fff;border-radius:12px;padding:9px 12px}
.feld-t b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
code{font-family:var(--mono);font-size:13px;background:rgba(20,30,60,.06);padding:1px 6px;border-radius:6px}
main{padding-bottom:20px}
.gpu svg{width:90px;height:22px}
@media (max-width:1760px){.gpu svg,.gpu .trenner{display:none}.ds-wahl > span{display:none}}
@media (max-width:1480px){.leiste .titel h1{display:none}#ds selectedcontent .ds-n{display:none}}
@media (max-width:1240px){.leiste .tab{padding:8px 11px;font-size:14px}.leiste{gap:8px}#gpu-text .zusatz{display:none}}
@media (max-width:1000px){.leiste{flex-wrap:wrap}}
.gpu .ln{fill:none;stroke:var(--good);stroke-width:1.6}.gpu .fl{fill:rgba(15,157,88,.13)}.gpu .vr{fill:none;stroke:var(--c1);stroke-width:1.4;stroke-dasharray:3 2}
.gpu b{font-variant-numeric:tabular-nums}
.drei{display:grid;grid-template-columns:330px minmax(0,1fr) 290px;gap:16px;align-items:start}
@media (max-width:1350px){.drei{grid-template-columns:320px minmax(0,1fr)}.drei .ablauf{grid-column:1/-1}}
@media (max-width:900px){.drei{grid-template-columns:1fr}}
.links,.ablauf{height:calc(100vh - 150px);min-height:520px;overflow-y:auto}
.links{display:flex;flex-direction:column;padding:0;overflow:hidden}
.cl-kopf{display:flex;align-items:center;gap:6px;padding:12px 12px;border-bottom:1px solid var(--linie)}
.cl-select{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:40px}
.cl-select selectedcontent{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.cl-select{flex:1;min-width:0;border:0;background:rgba(255,255,255,.85);border-radius:12px;padding:9px 10px;font-weight:600;font-size:14.5px;cursor:pointer}
.cl-pfeil{width:34px;height:34px;flex:none;border:0;border-radius:10px;background:rgba(255,255,255,.7);font-size:20px;line-height:1;cursor:pointer;color:var(--ink-2)}
.cl-pfeil:hover{background:#fff;color:var(--ink)}
.cl-mitte{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.cl-meta{display:flex;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
.cl-text{white-space:pre-wrap;font-size:15px;line-height:1.5;max-height:9.2em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
.cl-text.offen{max-height:none;-webkit-mask-image:none}
.cl-link{border:0;background:none;padding:0;color:var(--c1);font-weight:600;font-size:13px;cursor:pointer;align-self:flex-start}
.cl-hinweis summary{cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:600}
.cl-hinweis div{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.cl-titel{font-size:13px;font-weight:700;color:var(--ink-2);margin-top:6px}
.cl-noten{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}
.cl-note{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1.5px solid transparent;border-radius:12px;padding:8px 10px;cursor:pointer;text-align:left;background:rgba(255,255,255,.7)}
.cl-note small{font-size:11.5px;color:var(--ink-3)}
.cl-note b{font-size:14.5px}
.cl-note.n1 b{color:#0b7a44}.cl-note.n3 b{color:#8a5d00}.cl-note.n5 b{color:#a62828}
.cl-note .falle{color:#a62828;font-weight:700}
.cl-note:hover{background:#fff}
.cl-note.an{border-color:var(--ink);background:#fff}
.cl-antw{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;border:1.5px solid transparent;background:rgba(255,255,255,.7);border-radius:12px;padding:10px 11px;cursor:pointer;font-size:14px}
.cl-antw:hover{background:#fff}
.cl-antw.an{background:#fff;border-color:var(--ink)}
.cl-antw .t{flex:1;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cl-radio{width:16px;height:16px;border-radius:50%;border:2px solid rgba(20,30,60,.25);flex:none;margin-top:2px}
.cl-antw.an .cl-radio{border:5px solid var(--ink)}
.cl-ref{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.cl-ref.n1{background:var(--good-bg);color:#0b7a44}.cl-ref.n3{background:var(--warn-bg);color:#7a5200}.cl-ref.n5{background:var(--crit-bg);color:#a62828}

      el("small", {}, d.fehler ? "Fehler: " + d.fehler : istFragen(d) ? `Fragen · ${d.aufgaben} Fragen · ${d.faecher.slice(0, 4).join(", ")}${d.faecher.length > 4 ? " …" : ""}` : `Bewerten · ${d.faecher.join(", ")} · ${d.aufgaben} Aufgaben · ${d.antworten} Antworten`)))) : el("p", { class: "klein" }, "Noch keiner – zieh oben deine Dateien hinein.")
  ].filter(Boolean));
  const R = $("#dt-rechts");
  if (!ds) {
    const w = Object.values(DT.warte);
    R.replaceChildren(w.length
      ? el("div", { class: "leerzustand" }, el("b", {}, "Fast fertig"), `Für ${w.map((x) => x.fachName).join(", ")} fehlt noch ${w.map((x) => !x.aufgaben ? "aufgaben.json" : "referenz.json").join(" bzw. ")}. Leg sie links nach – dann wird automatisch hochgeladen.`)
      : el("div", { class: "leerzustand" }, el("b", {}, "Noch kein eigener Datensatz"), "Links eine Datei hineinziehen oder aus Hugging Face, Kaggle, Link oder Datenbank laden – oder oben die Demo-Daten einschalten."));

}

/* Einträge eines Datensatzes: Liste mit Mehrfachauswahl (Checkboxen, Shift-Bereich, Alle), Suche, Löschen mit Rückgängig */
const AW = { ds: null, ids: new Set(), letzte: null, filter: "", zeigen: 150 };
function zeichneEintraege(ds, liste) {
  const R = $("#dt-rechts"), fragen = istFragen(ds), darf = !!ds.eigen;
  if (AW.ds !== ds.id) Object.assign(AW, { ds: ds.id, ids: new Set(), letzte: null, filter: "", zeigen: 150 });
  const alleIds = new Set(liste.map((x) => String(x.id)));
  AW.ids.forEach((id) => { if (!alleIds.has(id)) AW.ids.delete(id); });
  const text = (x) => (fragen ? [x.id, x.frage, x.antwort, x.thema] : [x.id, x.thema, x.fach, x.aufgabe]).join(" ").toLowerCase();
  const sicht = () => AW.filter ? liste.filter((x) => text(x).includes(AW.filter.toLowerCase())) : liste;
  const einheit = (n) => fragen ? (n === 1 ? "Frage" : "Fragen") : (n === 1 ? "Aufgabe" : "Aufgaben");

  const kopf = el("div", { class: "ew-kopf" }, el("h2", {}, ds.name),
    el("span", { class: "klein" }, fragen ? `${liste.length} Fragen` : `${liste.length} Aufgaben · ${ds.antworten} Antworten`),
    darf ? el("button", { class: "knopf klein ds-entfernen", html: ic("muell") + "Datensatz entfernen", onclick: () => datensatzEntfernen(ds) }) : "");
  const alle = el("input", { type: "checkbox", class: "ew-cb", title: "Alle (gefilterten) auswählen" });
  const suche = el("input", { type: "search", class: "ew-suche", placeholder: `${fragen ? "Fragen" : "Aufgaben"} durchsuchen …`, value: AW.filter });
  const info = el("div", { class: "ew-info" }), liste_el = el("div", { class: "ew-liste" });

  const leiste = () => {
    const v = sicht(), gew = v.filter((x) => AW.ids.has(String(x.id))).length;
    alle.checked = v.length > 0 && gew === v.length; alle.indeterminate = gew > 0 && gew < v.length;
    const n = AW.ids.size;
    info.replaceChildren(...(n ? [el("b", {}, `${n} ausgewählt`),
        el("button", { class: "knopf klein ew-loeschen", html: ic("muell") + "Löschen", onclick: loeschen }),
        el("button", { class: "cl-link", onclick: () => { AW.ids.clear(); AW.letzte = null; zeichneListe(); } }, "Auswahl aufheben")]
      : [el("span", { class: "klein" }, AW.filter ? `${v.length} von ${liste.length} ${einheit(liste.length)}` : darf ? "Einträge auswählen, um sie zu löschen" : "Mitgelieferte Daten – nur ansehen")]));
    leisteEl.classList.toggle("aktiv", n > 0);
  };
  const waehle = (id, an, shift) => {
    const v = sicht().map((x) => String(x.id));
    if (shift && AW.letzte != null && v.includes(AW.letzte)) {
      const [a, b] = [v.indexOf(AW.letzte), v.indexOf(id)].sort((x, y) => x - y);
      v.slice(a, b + 1).forEach((k) => an ? AW.ids.add(k) : AW.ids.delete(k));
    } else an ? AW.ids.add(id) : AW.ids.delete(id);
    AW.letzte = id;
    liste_el.querySelectorAll(".ew-zeile").forEach((z) => { const k = z.dataset.id, cb = z.querySelector(".ew-cb"); cb.checked = AW.ids.has(k); z.classList.toggle("gewaehlt", cb.checked); });
    leiste();
  };
  const zeile = (x) => {
    const id = String(x.id), cb = el("input", { type: "checkbox", class: "ew-cb", checked: AW.ids.has(id), "aria-label": `${id} auswählen` });
    cb.onclick = (ev) => { ev.stopPropagation(); waehle(id, cb.checked, ev.shiftKey); };
    const kopfZeile = fragen
      ? [el("span", { class: "id" }, id), el("b", { class: "ew-titel" }, x.frage), el("span", { class: "klein ew-rechts" }, (x.thema ? x.thema + " · " : "") + WERTUNG_TEXT[x.wertung])]
      : [el("span", { class: "id" }, id), el("b", { class: "ew-titel" }, x.thema || x.fach), el("span", { class: "klein ew-rechts" }, `${x.fach} · ${x.max_punkte} P. · ${x.antworten.length} Antworten`)];
    const inhalt = fragen
      ? [x.kontext ? el("div", { class: "feld-t" }, el("b", {}, "Kontext"), x.kontext) : "",
         el("div", { class: "feld-t" }, el("b", {}, "Frage"), x.frage, x.optionen ? el("div", { style: "margin-top:6px" }, x.optionen.map((o, i) => el("div", {}, "ABCDEFGH"[i] + ") " + o))) : "", bilderVon(ds.id, x)),
         el("div", { class: "feld-t" }, el("b", {}, "Soll-Antwort · " + WERTUNG_TEXT[x.wertung]), x.antwort)]
      : [el("div", { class: "feld-t" }, el("b", {}, "Aufgabe"), x.aufgabe, bilderVon(ds.id, x)), x.hinweis ? el("div", { class: "feld-t" }, el("b", {}, "Hinweis"), x.hinweis) : "",
         el("details", {}, el("summary", { class: "klein" }, "Musterlösung und Raster"), el("div", { class: "feld-t", style: "margin-top:6px" }, el("b", {}, "Musterlösung"), x.musterloesung), el("div", { class: "feld-t", style: "margin-top:6px" }, el("b", {}, "Raster"), x.bewertungsraster)),
         ...x.antworten.map((a) => el("div", { class: "feld-t" }, el("b", {}, `${a.id} · Referenz: Note ${a.referenz.note} (${a.referenz.punkte} P.)` + (a.falle ? " · Falle" : "")), a.antwort,
           a.referenz.feedback ? el("div", { class: "klein", style: "margin-top:4px" }, a.referenz.feedback) : ""))];
    return el("details", { class: "aufgabe-k ew-zeile" + (AW.ids.has(id) ? " gewaehlt" : ""), "data-id": id },
      el("summary", {}, darf ? cb : "", ...kopfZeile), el("div", { class: "inhalt" }, ...inhalt));
  };
  const zeichneListe = () => {
    const v = sicht();
    liste_el.replaceChildren(...(v.length ? v.slice(0, AW.zeigen).map(zeile) : [el("div", { class: "klein", style: "padding:14px 4px" }, "Keine Treffer.")]),
      v.length > AW.zeigen ? el("button", { class: "knopf ew-mehr", onclick: () => { AW.zeigen += 300; zeichneListe(); } }, `Weitere anzeigen (${v.length - AW.zeigen} übrig)`) : "");
    leiste();
  };
  alle.onclick = () => { const v = sicht(); v.forEach((x) => alle.checked ? AW.ids.add(String(x.id)) : AW.ids.delete(String(x.id))); AW.letzte = null; zeichneListe(); };
  let warte; suche.oninput = () => { clearTimeout(warte); warte = setTimeout(() => { AW.filter = suche.value.trim(); AW.zeigen = 150; zeichneListe(); }, 150); };

  async function loeschen() {
    const ids = [...AW.ids], n = ids.length;
    if (n >= liste.length) { datensatzEntfernen(ds); return; }
    try {
      const j = await api("api/arena/eintraege-loeschen", { datensatz: ds.id, ids });
      AW.ids.clear(); AW.letzte = null; delete S.aufgaben[ds.id];
      await ladeDatensaetze(); zeichneDaten();
      toast(`${j.geloescht} ${einheit(j.geloescht)} gelöscht`, "Rückgängig", async () => {
        await api("api/arena/eintraege-wiederherstellen", { datensatz: ds.id, token: j.token });
        delete S.aufgaben[ds.id]; AW.ids = new Set(ids); await ladeDatensaetze(); zeichneDaten();
        toast(`${n} ${einheit(n)} wiederhergestellt`);
      });
    } catch (e) { toast(e.message); }
  }
  const leisteEl = el("div", { class: "ew-leiste" }, darf ? alle : "", suche, info);
  document.onkeydown = (ev) => {   // Strg/Cmd+A wählt alle sichtbaren, Entf löscht, Esc hebt auf – nur im Daten-Tab und ohne offenes Fenster/Eingabefeld
    if (S.tab !== "s-daten" || $("#fenster").open || !darf || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
    if ((ev.ctrlKey || ev.metaKey) && ev.key === "a") { ev.preventDefault(); sicht().forEach((x) => AW.ids.add(String(x.id))); zeichneListe(); }
    else if ((ev.key === "Delete" || ev.key === "Backspace") && AW.ids.size) { ev.preventDefault(); loeschen(); }
    else if (ev.key === "Escape" && AW.ids.size) { AW.ids.clear(); zeichneListe(); }
  };
  R.replaceChildren(kopf, leisteEl, liste_el);
  zeichneListe();
}

/* kleine Meldung unten mit optionaler Aktion (z. B. Rückgängig) */
function toast(text, aktion, fn, ms = 8000) {
  document.querySelector(".toast")?.remove();
  const t = el("div", { class: "toast", role: "status" }, el("span", {}, text),
    aktion ? el("button", { onclick: async () => { t.remove(); try { await fn(); } catch (e) { toast(e.message); } } }, aktion) : "",
    el("button", { class: "toast-zu", title: "Schließen", html: ic("x"), onclick: () => t.remove() }));
  document.body.append(t); setTimeout(() => t.remove(), ms);
}

/* ---------- Markdown → DOM (sicher: nur Elemente und Textknoten, nie innerHTML) ---------- */
function markdown(text) {
  const inline = (t) => {   // **fett**, *kursiv*, `code`, [text](https://…)
    const teile = [], re = /(`[^`\n]+`)|(\*\*[^*\n]+?\*\*|__[^_\n]+?__)|(\*[^*\s][^*\n]*?\*|_[^_\s][^_\n]*?_)|(\[[^\]\n]+\]\((https?:\/\/[^)\s]+)\))/g;
    let i = 0, m;
    while ((m = re.exec(t))) {
      if (m.index > i) teile.push(document.createTextNode(t.slice(i, m.index)));
      if (m[1]) teile.push(el("code", {}, m[1].slice(1, -1)));
      else if (m[2]) teile.push(el("strong", {}, ...inline(m[2].slice(2, -2))));
      else if (m[3]) teile.push(el("em", {}, ...inline(m[3].slice(1, -1))));
      else if (m[4]) teile.push(el("a", { href: m[5], target: "_blank", rel: "noopener noreferrer" }, m[4].slice(1, m[4].indexOf("]"))));
      i = re.lastIndex;
    }
    if (i < t.length) teile.push(document.createTextNode(t.slice(i)));
    return teile;
  };
  const zeilen = String(text || "").replace(/\r/g, "").split("\n"), aus = [];
  let k = 0;
  while (k < zeilen.length) {
    const z = zeilen[k];
    if (/^\s*```/.test(z)) {   // Codeblock (auch noch offen während des Streamens)
      const code = []; k++;
      while (k < zeilen.length && !/^\s*```/.test(zeilen[k])) code.push(zeilen[k++]);
      k++; aus.push(el("pre", {}, el("code", {}, code.join("\n")))); continue;
    }
    const h = z.match(/^\s{0,3}(#{1,6})\s+(.*)$/);
    if (h) { aus.push(el("h" + Math.min(6, h[1].length + 2), {}, ...inline(h[2].replace(/\s#+\s*$/, "")))); k++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(z)) { aus.push(el("hr")); k++; continue; }
    if (/^\s*>/.test(z)) { const b = []; while (k < zeilen.length && /^\s*>/.test(zeilen[k])) b.push(zeilen[k++].replace(/^\s*>\s?/, "")); aus.push(el("blockquote", {}, ...markdown(b.join("\n")))); continue; }
    if (/^\s*\|.*\|\s*$/.test(z) && k + 1 < zeilen.length && /^\s*\|?\s*:?-{2,}/.test(zeilen[k + 1])) {   // Tabelle
      const zellen = (x) => x.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const kopf = zellen(z); k += 2; const reihen = [];
      while (k < zeilen.length && /^\s*\|.*\|\s*$/.test(zeilen[k])) reihen.push(zellen(zeilen[k++]));
      aus.push(el("div", { class: "md-tab" }, el("table", {}, el("tr", {}, kopf.map((c) => el("th", {}, ...inline(c)))), reihen.map((r) => el("tr", {}, r.map((c) => el("td", {}, ...inline(c))))))));
      continue;
    }
    const li = z.match(/^\s*([-*+•]|\d+[.)])\s+(.*)$/);
    if (li) {   // Liste (nummeriert oder Punkte, eingerückte Unterpunkte eine Ebene)
      const nummer = /\d/.test(li[1]), liste = el(nummer ? "ol" : "ul", nummer && parseInt(li[1]) !== 1 ? { start: parseInt(li[1]) } : {});
      while (k < zeilen.length) {
        const m = zeilen[k].match(/^(\s*)([-*+•]|\d+[.)])\s+(.*)$/);
        if (!m) { if (zeilen[k].trim() && /^\s{2,}/.test(zeilen[k]) && liste.lastChild) { liste.lastChild.append(document.createTextNode(" "), ...inline(zeilen[k].trim())); k++; continue; } break; }
        if (m[1].length >= 2 && liste.lastChild) {
          let unter = liste.lastChild.querySelector(":scope > ul, :scope > ol");
          if (!unter) { unter = el(/\d/.test(m[2]) ? "ol" : "ul"); liste.lastChild.append(unter); }
          unter.append(el("li", {}, ...inline(m[3])));
        } else liste.append(el("li", {}, ...inline(m[3])));
        k++;
      }
      aus.push(liste); continue;
    }
    if (!z.trim()) { k++; continue; }
    const absatz = [];
    while (k < zeilen.length && zeilen[k].trim() && !/^\s*(```|#{1,6}\s|>|([-*+•]|\d+[.)])\s)/.test(zeilen[k]) && !/^\s*\|.*\|\s*$/.test(zeilen[k])) absatz.push(zeilen[k++]);
    if (!absatz.length) { absatz.push(zeilen[k++]); }
    const p_ = el("p");
    absatz.forEach((a, n) => { if (n) p_.append(el("br")); p_.append(...inline(a)); });
    aus.push(p_);
  }
  return aus;
}

/* ---------- Einrichtung & Einstellungen als Fenster über der App ---------- */
function einstellungenAuf(bereich = "") {
  let d = $("#einst-fenster");
  if (!d) {
    d = el("dialog", { id: "einst-fenster", class: "einst-fenster" });
    d.addEventListener("close", async () => { d.replaceChildren(); await nachEinstellungen(); });
    document.body.append(d);
  }
  const rahmen = el("iframe", { src: "/einrichtung" + (bereich ? "#" + bereich : ""), title: "Einstellungen" });
  d.replaceChildren(rahmen);
  if (!d.open) d.showModal();
  rahmen.addEventListener("load", () => rahmen.contentWindow.focus());
}
let NACH_ZIEL = null;
window.addEventListener("message", (ev) => {
  const d = $("#einst-fenster");
  if (ev.origin !== location.origin || !d || ev.source !== d.querySelector("iframe")?.contentWindow) return;
  if (ev.data?.art === "einrichtung-fertig") { NACH_ZIEL = ev.data.ziel; d.close(); }
  if (ev.data?.art === "neustart") { Object.keys(localStorage).filter((x) => x.startsWith("mv-")).forEach((x) => localStorage.removeItem(x)); location.href = "/"; }
});
async function nachEinstellungen() {   // Einstellungen könnten sich geändert haben: alles frisch laden, ohne die Seite neu zu laden
  S.einst = await api("api/einstellungen").catch(() => S.einst);
  $("#demo").checked = !!S.einst.demo; setzeSystem();
  await ladeStatus(); await ladeDatensaetze();
  const ziel = (NACH_ZIEL || "").split("#")[1]; NACH_ZIEL = null;
  if (ziel && document.getElementById("s-" + ziel)) zeige("s-" + ziel); else zeichne();
}
$("#zahnrad").onclick = (ev) => { ev.preventDefault(); einstellungenAuf(); };

/* ---------- Start ---------- */
(async () => {
  S.einst = await api("api/einstellungen").catch(() => ({ demo: true }));
  $("#demo").checked = !!S.einst.demo; setzeSystem();
  await ladeStatus(); await ladeDatensaetze();
  const anker = location.hash, start = "s-" + (anker.startsWith("#import") ? "daten" : anker.slice(1) || "vergleich");
  zeige(document.getElementById(start) ? start : "s-vergleich");
  if (anker === "#modell-hinzufuegen") { zeige("s-modelle"); modellFenster(); }
  dlAktualisieren();
  if (!S.einst.eingerichtet) einstellungenAuf();            // erster Start: Einrichtungsassistent als Fenster
  else if (anker === "#einstellungen") einstellungenAuf();
  if (anker === "#werkzeuge") werkzeugFenster();
  ({ "#import-hf": importHF, "#import-kaggle": importKaggle, "#import-link": importURL, "#import-db": importDB })[anker]?.();
  setInterval(async () => { const vorher = (S.status.modelle || []).join(); await ladeStatus(); if ((S.status.modelle || []).join() !== vorher) zeichne(); }, 20000);
})();
